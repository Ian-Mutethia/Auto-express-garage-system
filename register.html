<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AutoFix Pro - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: url('https://images.pexels.com/photos/3786092/pexels-photo-3786092.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 20px;
        }
    </style>
</head>
<body class="container mt-5">
    <div class="card">
        <h2><i class="fas fa-user-plus"></i> Register - AutoFix Pro</h2>
        <a href="{{ url_for('index') }}" class="btn btn-secondary mb-3"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <form method="POST">
            <div class="mb-3">
                <label for="shop_id" class="form-label">Select Shop</label>
                <select class="form-select" id="shop_id" name="shop_id" required>
                    {% for shop in shops %}
                        <option value="{{ shop['shop_id'] }}">{{ shop['shop_name'] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="Customer">Customer</option>
                    <option value="Staff">Staff</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" class="form-control" id="phone" name="phone" required>
            </div>
            <div class="mb-3" id="staff_role_div" style="display: none;">
                <label for="staff_role" class="form-label">Staff Role</label>
                <select class="form-select" id="staff_role" name="staff_role">
                    <option value="Mechanic">Mechanic</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Register</button>
        </form>
        <script>
            document.getElementById('role').addEventListener('change', function() {
                document.getElementById('staff_role_div').style.display = this.value === 'Staff' ? 'block' : 'none';
            });
        </script>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
